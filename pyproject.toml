[project]
name = "qosst-alice"
description = "Alice submodule of QOSST, containing the server and DSP of Alice."
authors = [
    { name = "Yoann Piétri", email = "Yoann.Pietri@lip6.fr" },
    { name = "Matteo Schiavon", email = "Matteo.Schiavon@lip6.fr" },
]
license = "GPL-3.0-only"
readme = "README.md"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.10, <3.15"

dynamic = ["version"]

dependencies = [
    "qosst-hal @ git+https://github.com/qosst/qosst-hal@dev",
    "qosst-core @ git+https://github.com/qosst/qosst-core@dev",
]

[project.urls]
homepage = "https://github.com/qosst"
repository = "https://github.com/qosst/qosst-alice"
documentation = "https://qosst-alice.readthedocs.io/"


[project.scripts]
qosst-alice = "qosst_alice.alice:main"
qosst-alice-tools = "qosst_alice.tools.commands:main"


[tool.poetry]
version = "0.10.0.dev0"
packages = [{ include = "qosst_alice" }, { include = "qosst_alice/py.typed" }]

[tool.poetry.group.dev.dependencies]
Sphinx = "^8.1.0"
sphinx-rtd-theme = "^3.0.0"
docstr-coverage = "^2.2.0"
setuptools = "^82.0.1"
sphinx-argparse-cli = "^1.11.0"
sphinx-prompt = "^1.5.0"
myst-parser = [{ version = "^4.0.0", python = ">=3.10, <3.15" }]
sphinxcontrib-programoutput = "^0.17"
matplotlib = "^3.5.1"
scipy = [
    { version = ">=1.13.0, <1.17.0", python = ">=3.10, <3.11" },
    { version = ">=1.17.0, <2.0 ", python = ">=3.11, <3.15" },
]
pylint = "^4.0.5"
black = "^26.3.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
